# Additional rules for cpa-plugin-privacyfilter (gitleaks_mode: extend).
#
# They catch a credential that a person states in prose or in a config line,
# next to one of these words: пароль, секрет, токен, ключ, password, passwd.
# The embedded Gitleaks rules only recognise machine-looking secrets, so a
# short human password such as "мой пароль passW0RD!" is otherwise sent as is.
#
# An unquoted value must be at least 6 characters and contain a digit or one of
# !@#%^&*, which keeps ordinary words ("пароль должен быть ...") and most code
# identifiers out. A quoted value needs only the length.

title = "prose credentials"

[[rules]]
id = "prose-credential"
description = "Credential stated next to a credential word (ru/en)"
regex = '''(?i)(?:парол(?:ь|я|ю|ем|е)|секрет(?:а|у|ом|е)?|токен(?:а|у|ом|е)?|ключ(?:а|у|ом|е)?|password|passwd)(?:\s*[:=—–-]\s*|\s+(?:(?:is|это|такой|вот)\s*[:—–-]?\s+)?)((?:[^\s"'`,;()\[\]{}<>«»“”]{0}[0-9!@#%^&*][^\s"'`,;()\[\]{}<>«»“”]{4,}[^\s"'`,;()\[\]{}<>«»“”.:?]|[^\s"'`,;()\[\]{}<>«»“”]{1}[0-9!@#%^&*][^\s"'`,;()\[\]{}<>«»“”]{3,}[^\s"'`,;()\[\]{}<>«»“”.:?]|[^\s"'`,;()\[\]{}<>«»“”]{2}[0-9!@#%^&*][^\s"'`,;()\[\]{}<>«»“”]{2,}[^\s"'`,;()\[\]{}<>«»“”.:?]|[^\s"'`,;()\[\]{}<>«»“”]{3}[0-9!@#%^&*][^\s"'`,;()\[\]{}<>«»“”]{1,}[^\s"'`,;()\[\]{}<>«»“”.:?]|[^\s"'`,;()\[\]{}<>«»“”]{4}[0-9!@#%^&*][^\s"'`,;()\[\]{}<>«»“”]*[^\s"'`,;()\[\]{}<>«»“”.:?]|[^\s"'`,;()\[\]{}<>«»“”]{5,}[0-9!@#%^&*](?:[^\s"'`,;()\[\]{}<>«»“”]*[^\s"'`,;()\[\]{}<>«»“”.:?])?))'''
secretGroup = 1
keywords = ["парол", "секрет", "токен", "ключ", "password", "passwd"]

[[rules]]
id = "prose-credential-quoted"
description = "Quoted credential stated next to a credential word (ru/en)"
regex = '''(?i)(?:парол(?:ь|я|ю|ем|е)|секрет(?:а|у|ом|е)?|токен(?:а|у|ом|е)?|ключ(?:а|у|ом|е)?|password|passwd)(?:\s*[:=—–-]\s*|\s+(?:(?:is|это|такой|вот)\s*[:—–-]?\s+)?)["'«“]([^\s"'`«»“”]{6,64})["'»”]'''
secretGroup = 1
keywords = ["парол", "секрет", "токен", "ключ", "password", "passwd"]
